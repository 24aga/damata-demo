<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>DAMATA Peças e Ferramentas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: vitrine premium do agro. Faixas escuras (verde-mata e azul-noite) com arte de lavoura em perspectiva,
   base em papel claro levemente esverdeado, trigo como acento discreto. Navegação com mega menu e barra inferior no celular.
   Tema claro único, por escolha: a logo oficial tem fundo branco e o site real será claro. */
:root{
  --green:#019040; --green-d:#017236; --green-soft:#e7f3ec;
  --forest:#062b1b; --forest-2:#0b3d27;
  --blue:#04019A; --night:#0a0a33; --blue-soft:#ecebfb;
  --wheat:#d6a43a; --wheat-soft:#f7edd6;
  --ink:#111613; --muted:#5c645f; --line:#e1e5e1; --paper:#f5f6f2; --bg:#ffffff;
  --warn:#9a5700; --warn-soft:#fdf1df; --danger:#c0392b; --danger-soft:#fdeceb;
  --f-display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:12px; --r-s:8px;
  --sh-1:0 1px 2px rgba(17,22,19,.05),0 2px 8px rgba(17,22,19,.05);
  --sh-2:0 10px 30px rgba(17,22,19,.10),0 2px 6px rgba(17,22,19,.06);
  --gut-l:max(16px,env(safe-area-inset-left,0px)); --gut-r:max(16px,env(safe-area-inset-right,0px));
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:70;background:var(--night)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.005em;font-weight:700}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--wheat);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:var(--gut-l);padding-right:var(--gut-r)}
.mono{font-family:var(--f-mono);font-size:.86em}
.muted{color:var(--muted)}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--green-d)}
.eyebrow::before{content:"";width:22px;height:2px;background:var(--wheat)}
.eyebrow.light{color:#bfe8cf}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:1px solid transparent;border-radius:999px;padding:12px 22px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap;min-height:46px;background:var(--paper);color:var(--ink);transition:background .15s,border-color .15s,transform .15s,box-shadow .15s}
.btn:active{transform:translateY(1px)}
.btn-green{background:var(--green);color:#fff;box-shadow:0 6px 16px rgba(1,144,64,.25)}
.btn-green:hover{background:var(--green-d)}
.btn-dark{background:var(--forest);color:#fff}
.btn-light{background:#fff;color:var(--forest)}
.btn-glass{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.35)}
.btn-glass:hover{background:rgba(255,255,255,.16)}
.btn-outline{background:var(--bg);border-color:var(--line)}
.btn-outline:hover{border-color:var(--ink)}
.btn-ghost{background:transparent}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{padding:7px 14px;min-height:36px;font-size:13.5px}
.btn svg{width:18px;height:18px;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--paper);color:var(--muted)}
.chip.ok{background:var(--green-soft);color:var(--green-d)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--danger-soft);color:var(--danger)}
.chip.blue{background:var(--blue-soft);color:var(--blue)}
.chip.sale{background:var(--wheat);color:#2a1d00}
.chip.new{background:var(--forest);color:#fff}

/* ===== cabeçalho ===== */
.util{background:var(--night);color:#c9c9e6;font-size:12.5px}
.util .wrap{display:flex;gap:18px;align-items:center;justify-content:space-between;min-height:36px;flex-wrap:wrap}
.util .l{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.util .l span{display:inline-flex;gap:6px;align-items:center}
.util svg{width:14px;height:14px;color:var(--wheat)}
.util a{color:#fff;text-decoration:none;font-weight:600}
.util .demo{background:var(--wheat);color:#2a1d00;padding:2px 9px;border-radius:999px;font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.site-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(255,255,255,.96);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.head-row{display:flex;align-items:center;gap:28px;padding-block:14px}
.logo{display:block;flex:none;line-height:0}
.logo img{height:50px;width:auto}
.search{position:relative;flex:1;min-width:0;max-width:640px}
.search input{width:100%;height:50px;border:1px solid var(--line);border-radius:999px;padding:0 58px 0 22px;background:var(--paper);transition:border-color .15s,background .15s,box-shadow .15s}
.search input:focus{border-color:var(--green);background:var(--bg);outline:none;box-shadow:0 0 0 4px rgba(1,144,64,.12)}
.search button{position:absolute;right:5px;top:5px;height:40px;width:40px;border:0;border-radius:50%;background:var(--forest);color:#fff;cursor:pointer;display:grid;place-items:center}
.search button svg{width:18px;height:18px}
.suggest{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh-2);overflow:hidden;z-index:60;padding:6px}
.suggest a{display:flex;gap:12px;align-items:center;padding:10px 12px;text-decoration:none;border-radius:10px}
.suggest a:hover{background:var(--paper)}
.suggest .s-name{font-weight:600;font-size:14px}
.suggest .s-meta{font-size:12px;color:var(--muted)}
.head-actions{display:flex;gap:10px;flex:none;margin-left:auto}
.icon-pill{position:relative;display:inline-flex;align-items:center;gap:10px;text-decoration:none;padding:6px 14px 6px 6px;border-radius:999px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:600;font-size:14px}
.icon-pill .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--paper)}
.icon-pill .ic svg{width:18px;height:18px}
.icon-pill.wa .ic{background:var(--green);color:#fff}
.icon-pill small{display:block;font-size:11px;color:var(--muted);font-weight:500;line-height:1.1}
.icon-pill b{display:block;line-height:1.15}
.badge{position:absolute;top:-4px;left:30px;background:var(--wheat);color:#2a1d00;border-radius:999px;font-size:11px;font-weight:800;min-width:20px;height:20px;display:grid;place-items:center;padding:0 5px;border:2px solid #fff}
.nav-row{border-top:1px solid var(--line)}
.nav-row .wrap{display:flex;align-items:center;gap:6px}
.mega-btn{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 18px;border:0;background:var(--forest);color:#fff;font-weight:600;cursor:pointer;font-size:14px;border-radius:0}
.mega-btn svg{width:18px;height:18px}
.nav-links{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0}
.nav-links a{display:inline-flex;align-items:center;height:48px;padding:0 14px;font-size:14px;font-weight:600;text-decoration:none;color:#3c443f;white-space:nowrap;position:relative}
.nav-links a::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--green);transform:scaleX(0);transition:transform .2s}
.nav-links a:hover::after,.nav-links a.on::after{transform:scaleX(1)}
.nav-links a.hot{color:var(--warn)}
.nav-links a.hot::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--wheat);margin-right:8px}
.mega{position:absolute;left:0;right:0;top:100%;background:var(--bg);border-bottom:1px solid var(--line);box-shadow:0 30px 60px rgba(17,22,19,.12);z-index:55}
.mega .wrap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) 300px;gap:8px;padding-block:22px}
.mega a.mc{display:flex;gap:14px;align-items:center;padding:14px;border-radius:var(--r);text-decoration:none}
.mega a.mc:hover{background:var(--paper)}
.mega .mc .ci{width:46px;height:46px;border-radius:12px;background:var(--green-soft);color:var(--green-d);display:grid;place-items:center;flex:none}
.mega .mc .ci svg{width:24px;height:24px}
.mega .mc b{display:block;font-family:var(--f-display);font-size:17px}
.mega .mc span{font-size:12.5px;color:var(--muted)}
.mega-side{grid-row:1 / span 2;grid-column:4;background:var(--forest);color:#fff;border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.mega-side h4{font-size:22px}
.mega-side p{font-size:13.5px;color:#c3dccd}
.mega-side .btn{align-self:flex-start;margin-top:auto}
.burger{display:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--bg);place-items:center;cursor:pointer;flex:none}
.burger svg{width:20px;height:20px}
@media (max-width:900px){
  .util .l span.hide-m{display:none}
  .head-row{flex-wrap:wrap;gap:12px;padding-block:10px}
  .logo img{height:38px}
  .burger{display:grid}
  .search{order:3;flex-basis:100%;max-width:none}
  .search input{height:46px}
  .search button{height:36px;width:36px}
  .head-actions .txt{display:none}
  .head-actions .icon-pill{padding:4px;border:0}
  .head-actions .icon-pill.wa{display:none}
  .nav-row{display:none}
}

/* drawer + barra inferior (celular) */
.drawer-back{position:fixed;inset:0;background:rgba(6,20,13,.5);z-index:90}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(86vw,360px);background:var(--bg);z-index:91;display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));overflow:auto;box-shadow:var(--sh-2)}
.drawer .dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.drawer .dh img{height:34px}
.drawer h5{font-family:var(--f-display);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.drawer a{display:flex;align-items:center;gap:12px;padding:11px 8px;border-radius:10px;text-decoration:none;font-weight:600}
.drawer a:hover{background:var(--paper)}
.drawer a .ci{width:34px;height:34px;border-radius:9px;background:var(--green-soft);color:var(--green-d);display:grid;place-items:center}
.drawer a .ci svg{width:19px;height:19px}
.bnav{display:none}
@media (max-width:900px){
  .site{padding-bottom:calc(66px + env(safe-area-inset-bottom,0px))}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .bnav a,.bnav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;text-decoration:none;color:var(--muted);background:none;border:0;padding:4px 0;cursor:pointer;position:relative}
  .bnav svg{width:22px;height:22px}
  .bnav .on{color:var(--green-d)}
  .bnav .wa-b span.i{width:44px;height:44px;margin-top:-20px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(1,144,64,.35);border:3px solid #fff}
  .bnav .badge{left:auto;right:calc(50% - 22px);top:-2px}
  .wa-float{display:none!important}
}

/* ===== hero / banners ===== */
.hero{position:relative;background:var(--forest);color:#fff;overflow:hidden}
.slides{display:grid}
.slide{grid-area:1/1;position:relative;opacity:0;visibility:hidden;transition:opacity .7s ease,visibility .7s}
.slide.on{opacity:1;visibility:visible}
.slide-art{position:absolute;inset:0}
.slide-art svg,.slide-art img{width:100%;height:100%;display:block;object-fit:cover}
.slide-art img{object-position:75% center}
.slide-art::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,22,14,.92) 0%,rgba(4,22,14,.72) 38%,rgba(4,22,14,.05) 75%)}
.slide.night .slide-art::after{background:linear-gradient(90deg,rgba(8,8,40,.94) 0%,rgba(8,8,40,.7) 40%,rgba(8,8,40,.05) 78%)}
.slide-in{position:relative;z-index:1;padding-block:84px 156px;min-height:520px;display:flex;align-items:center}
.slide-copy{max-width:600px}
.slide h1,.slide h2{font-size:clamp(38px,5.4vw,68px);font-weight:700;letter-spacing:-.015em;margin-top:16px;line-height:1}
.slide h1 em,.slide h2 em{font-style:normal;color:var(--wheat)}
.slide p.sub{margin-top:18px;font-size:18px;color:#d3e4da;max-width:48ch}
.slide .ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.hero-ctrl{position:absolute;left:0;right:0;bottom:90px;z-index:3}
.hero-ctrl .wrap{display:flex;align-items:center;gap:14px}
.dots{display:flex;gap:8px}
.dots button{width:34px;height:4px;border-radius:4px;border:0;background:rgba(255,255,255,.3);cursor:pointer;padding:0;position:relative;overflow:hidden}
.dots button.on::after{content:"";position:absolute;inset:0;background:var(--wheat);transform-origin:left;animation:fill 6.5s linear forwards}
.hero.paused .dots button.on::after{animation-play-state:paused}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.arrows{display:flex;gap:8px;margin-left:8px}
.arrows button{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.06);color:#fff;cursor:pointer;display:grid;place-items:center}
.arrows svg{width:16px;height:16px}
.finder-wrap{position:relative;z-index:5;margin-top:-62px}
.finder{background:var(--bg);border-radius:18px;box-shadow:var(--sh-2);padding:18px;display:grid;grid-template-columns:auto minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line)}
.finder .ft{display:flex;flex-direction:column;padding:0 10px 0 6px;border-right:1px solid var(--line)}
.finder .ft b{font-family:var(--f-display);font-size:20px;line-height:1.1}
.finder .ft span{font-size:12px;color:var(--muted)}
.finder label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;min-width:0}
.finder input,.finder select{height:46px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:var(--paper);width:100%;text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink);font-size:14.5px}
.finder .btn{height:52px;align-self:end}
@media (max-width:1000px){.finder{grid-template-columns:1fr 1fr}.finder .ft{grid-column:1/-1;border-right:0;padding:0 2px 4px}.finder label:first-of-type{grid-column:1/-1}.finder .btn{grid-column:1/-1}}
@media (max-width:700px){
  .slide-in{padding-block:52px 132px;min-height:0}
  .slide-art::after,.slide.night .slide-art::after{background:linear-gradient(180deg,rgba(4,22,14,.55),rgba(4,22,14,.92))}
  .slide p.sub{font-size:16px}
  .hero-ctrl{bottom:78px}
  .finder-wrap{margin-top:-48px}
  .finder{grid-template-columns:1fr;padding:16px}
  .finder label{grid-column:auto!important}
}

/* faixa de confiança */
.trust{padding-block:28px 8px}
.trust .wrap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.trust .t{display:flex;gap:14px;align-items:flex-start;padding:6px}
.trust .t .ci{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--green-d);flex:none}
.trust .t .ci svg{width:21px;height:21px}
.trust b{display:block;font-size:14.5px}
.trust span{font-size:13px;color:var(--muted)}
@media (max-width:900px){.trust .wrap{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.trust .wrap{grid-template-columns:1fr}}

section.block{padding-block:64px}
section.block.paper{background:var(--paper)}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:28px;flex-wrap:wrap}
.sec-head h2{font-size:clamp(28px,3.4vw,42px);margin-top:10px}
.link-arrow{font-weight:600;color:var(--forest);text-decoration:none;white-space:nowrap;display:inline-flex;gap:8px;align-items:center}
.link-arrow svg{width:16px;height:16px;transition:transform .2s}
.link-arrow:hover svg{transform:translateX(3px)}

/* categorias */
.cats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.cat-card{position:relative;display:flex;flex-direction:column;gap:16px;padding:22px 18px 18px;border-radius:16px;text-decoration:none;background:var(--bg);border:1px solid var(--line);transition:transform .2s,box-shadow .2s,border-color .2s;overflow:hidden;min-height:190px}
.cat-card::before{content:"";position:absolute;right:-30px;bottom:-30px;width:120px;height:120px;border-radius:50%;background:var(--green-soft);transition:transform .3s}
.cat-card:hover{transform:translateY(-3px);box-shadow:var(--sh-2);border-color:transparent}
.cat-card:hover::before{transform:scale(1.4)}
.cat-ico{position:relative;width:54px;height:54px;border-radius:14px;background:var(--forest);color:#fff;display:grid;place-items:center}
.cat-ico svg{width:28px;height:28px}
.cat-card b{position:relative;font-family:var(--f-display);font-size:20px;line-height:1.1;margin-top:auto}
.cat-card .cnt{position:relative;font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.cat-card .cnt svg{width:16px;height:16px;color:var(--green-d)}
.cat-card.has-photo{padding:10px 10px 16px;gap:12px;min-height:0}
.cat-card.has-photo::before{display:none}
.cat-card.has-photo b,.cat-card.has-photo .cnt{padding:0 8px}
.cat-photo{display:block;aspect-ratio:1/1;max-width:100%;border-radius:12px;overflow:hidden;background:var(--forest)}
.cat-photo img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.cat-card:hover .cat-photo img{transform:scale(1.06)}
.mega .mc .ci img,.drawer a .ci img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.mega .mc .ci,.drawer a .ci{overflow:hidden}
@media (max-width:1100px){.cats{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.cats{grid-template-columns:repeat(2,minmax(0,1fr))}.cat-card{min-height:160px}}

/* por máquina */
.machines{background:var(--night);color:#fff;position:relative;overflow:hidden}
.machines .art{position:absolute;inset:0;opacity:.5}
.machines .art svg{width:100%;height:100%}
.machines .wrap{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:48px;align-items:center;padding-block:64px}
.machines h2{font-size:clamp(30px,3.6vw,46px);margin-top:10px}
.machines p{color:#c5c5e4;margin-top:12px}
.mlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mlist button{display:flex;align-items:center;gap:12px;text-align:left;padding:14px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);color:#fff;cursor:pointer;font-weight:600;transition:background .15s,border-color .15s}
.mlist button:hover{background:rgba(255,255,255,.12);border-color:var(--wheat)}
.mlist .ci{width:36px;height:36px;border-radius:50%;background:rgba(214,164,58,.18);color:var(--wheat);display:grid;place-items:center;flex:none}
.mlist .ci svg{width:19px;height:19px}
.mlist small{display:block;font-weight:500;color:#a9a9cf;font-size:12px}
@media (max-width:860px){.machines .wrap{grid-template-columns:1fr;gap:26px}}
@media (max-width:480px){.mlist{grid-template-columns:1fr}}

/* abas de vitrine */
.tabs{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:9px 18px;border-radius:999px;font-weight:600;cursor:pointer;color:var(--muted);font-size:14px}
.tabs button.on{background:var(--forest);color:#fff}

/* cartões de produto */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.catalog .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.catalog .grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:720px){.grid,.catalog .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
.pcard{position:relative;display:flex;flex-direction:column;border-radius:16px;background:var(--bg);border:1px solid var(--line);overflow:hidden;transition:box-shadow .2s,transform .2s,border-color .2s;min-width:0}
.pcard:hover{box-shadow:var(--sh-2);transform:translateY(-2px);border-color:transparent}
.pimg{position:relative;display:grid;place-items:center;aspect-ratio:1/1;max-width:100%;overflow:hidden;text-decoration:none;background:radial-gradient(120% 90% at 50% 20%,#fff 0%,var(--paper) 70%)}
.pimg img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.pcard:hover .pimg img{transform:scale(1.04)}
.pimg .tags{position:absolute;left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap}
.ph{display:flex;flex-direction:column;align-items:center;gap:8px;color:#a3ada6}
.ph svg{width:56px;height:56px;stroke-width:1.4}
.ph span{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.12em}
.qadd{position:absolute;right:10px;top:10px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.95);cursor:pointer;display:grid;place-items:center;color:var(--forest);transition:background .15s}
.qadd:hover{background:var(--forest);color:#fff}
.qadd svg{width:17px;height:17px}
.pbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
.pbrand{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pname{font-family:var(--f-display);font-weight:600;font-size:18px;line-height:1.15;text-decoration:none;overflow-wrap:anywhere}
.pname:hover{color:var(--green-d)}
.pmeta{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.pfoot{margin-top:auto;padding-top:12px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;border-top:1px dashed var(--line)}
.pprice{display:flex;flex-direction:column;gap:0}
.pprice .now{font-family:var(--f-display);font-weight:700;font-size:23px;font-variant-numeric:tabular-nums;line-height:1.1}
.pprice .old{font-size:12.5px;color:var(--muted);text-decoration:line-through}
.pprice .ask{font-weight:700;color:var(--forest);font-size:14.5px}
.wa-mini{width:44px;height:44px;border-radius:50%;border:0;background:var(--green);color:#fff;cursor:pointer;display:grid;place-items:center;flex:none;box-shadow:0 4px 12px rgba(1,144,64,.3)}
.wa-mini:hover{background:var(--green-d)}
.wa-mini svg{width:21px;height:21px}
.avail{font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px;margin-top:2px}
.avail::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.avail.in{color:var(--green-d)}.avail.low{color:var(--warn)}.avail.out{color:var(--danger)}.avail.ask{color:var(--muted)}
@media (max-width:480px){.pbody{padding:12px}.pname{font-size:16px}.pprice .now{font-size:19px}.wa-mini{width:38px;height:38px}}

/* faixa promocional e CTA */
.promo{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);border-radius:22px;overflow:hidden;background:var(--forest);color:#fff;min-height:300px}
.promo .copy{padding:44px;display:flex;flex-direction:column;gap:14px;justify-content:center}
.promo h2{font-size:clamp(28px,3.4vw,44px)}
.promo p{color:#c3dccd;max-width:46ch}
.promo .art{position:relative;min-height:220px}
.promo .art svg{position:absolute;inset:0;width:100%;height:100%}
@media (max-width:760px){.promo{grid-template-columns:1fr}.promo .copy{padding:28px}.promo .art{order:-1;min-height:160px}}
.about{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;align-items:center}
.about h2{font-size:clamp(28px,3.4vw,42px);margin-top:10px}
.about p.lead{margin-top:16px;color:#3c443f;font-size:16.5px}
.photo-slot{aspect-ratio:5/4;max-width:100%;border-radius:22px;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:13.5px;padding:24px;background:repeating-linear-gradient(135deg,var(--paper) 0 14px,#eef0ea 14px 28px);border:1px solid var(--line)}
.photo-slot b{display:block;font-family:var(--f-display);font-size:18px;color:var(--ink);margin-bottom:4px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:26px}
.stats div{padding:14px 0;border-top:2px solid var(--forest)}
.stats b{display:block;font-family:var(--f-display);font-size:30px;line-height:1}
.stats span{font-size:12.5px;color:var(--muted)}
@media (max-width:860px){.about{grid-template-columns:1fr;gap:28px}}
.cta-band{background:linear-gradient(100deg,var(--green) 0%,var(--green-d) 100%);color:#fff;border-radius:22px;padding:40px 44px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;position:relative;overflow:hidden}
.cta-band::after{content:"";position:absolute;right:-80px;top:-80px;width:260px;height:260px;border-radius:50%;border:40px solid rgba(255,255,255,.07)}
.cta-band h2{font-size:clamp(26px,3vw,38px)}
.cta-band p{color:#dff3e6;margin-top:8px;max-width:58ch}
.cta-band .btn{position:relative;z-index:1}
@media (max-width:700px){.cta-band{grid-template-columns:1fr;padding:28px}.cta-band.has-img{background:linear-gradient(180deg,rgba(1,114,54,.92),rgba(1,114,54,.85)),var(--cta-img) center/cover}}

/* catálogo */
.page-hero{background:var(--forest);color:#fff;position:relative;overflow:hidden}
.page-hero .art{position:absolute;inset:0;opacity:.55}
.page-hero .art svg{width:100%;height:100%}
.page-hero .art.has-img{opacity:1}
.page-hero .art.has-img img{width:100%;height:100%;object-fit:cover}
.page-hero .art.has-img::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,22,14,.93) 0%,rgba(4,22,14,.8) 45%,rgba(4,22,14,.45) 100%)}
.machines .art.has-img{opacity:1}
.machines .art.has-img img{width:100%;height:100%;object-fit:cover}
.machines .art.has-img::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,10,51,.95) 0%,rgba(10,10,51,.82) 50%,rgba(10,10,51,.6) 100%)}
.promo .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.about-photo{margin:0;position:relative;border-radius:22px;overflow:hidden;aspect-ratio:5/4;max-width:100%;background:var(--forest)}
.about-photo img{width:100%;height:100%;object-fit:cover}
.about-photo figcaption{position:absolute;left:12px;bottom:12px;background:rgba(6,43,27,.82);color:#e6f2ea;font-size:11.5px;padding:5px 10px;border-radius:999px}
.cta-band.has-img{background:linear-gradient(100deg,var(--green) 0%,var(--green-d) 45%,rgba(1,114,54,.55) 80%,rgba(1,114,54,.35) 100%),var(--cta-img) right center/cover}
.login .art .bg img{width:100%;height:100%;object-fit:cover}
.page-hero .wrap{position:relative;padding-block:40px 44px}
.page-hero h1{font-size:clamp(34px,4.4vw,54px);margin-top:10px}
.page-hero p{color:#c3dccd;margin-top:8px;max-width:60ch}
.crumbs{font-size:12.5px;color:#a7c5b3;display:flex;gap:8px;flex-wrap:wrap}
.crumbs a{text-decoration:none}
.crumbs a:hover{color:#fff}
.crumbs.dark{color:var(--muted)}
.crumbs.dark a:hover{color:var(--ink)}
.catalog{display:grid;grid-template-columns:270px minmax(0,1fr);gap:32px;padding-block:32px 72px}
.filters{display:flex;flex-direction:column;gap:18px;align-self:start;position:sticky;top:160px;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:20px}
.filters h3{font-size:20px;display:flex;justify-content:space-between;align-items:center}
.filters h3 svg{width:18px;height:18px}
.filters label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.filters select,.filters input[type=search]{height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--paper);width:100%;text-transform:none;letter-spacing:0;color:var(--ink);font-weight:500;font-size:14px}
.check{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--green)}
.res-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.res-bar select{height:42px;border:1px solid var(--line);border-radius:999px;padding:0 14px;background:var(--bg)}
.active-f{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.active-f button{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.active-f button:hover{border-color:var(--danger);color:var(--danger)}
.pager{display:flex;gap:6px;justify-content:center;margin-top:32px;flex-wrap:wrap}
.pager button{min-width:42px;height:42px;border:1px solid var(--line);border-radius:50%;background:var(--bg);cursor:pointer;font-weight:600}
.pager button.on{background:var(--forest);color:#fff;border-color:var(--forest)}
.empty{border:1px dashed #c9cfc9;border-radius:16px;padding:44px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;background:var(--bg)}
.empty h3{font-size:24px}
.filters-toggle{display:none}
@media (max-width:900px){
  .catalog{grid-template-columns:1fr;padding-block:20px 48px}
  .filters{position:static;display:none}
  .filters.open{display:flex}
  .filters-toggle{display:inline-flex}
}

/* detalhe do produto */
.pd-top{background:var(--paper);border-bottom:1px solid var(--line)}
.pd-top .wrap{padding-block:16px}
.pd{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:48px;padding-block:32px 48px}
.gallery-main{aspect-ratio:1/1;max-width:100%;border-radius:20px;display:grid;place-items:center;overflow:hidden;cursor:zoom-in;border:1px solid var(--line);background:radial-gradient(120% 90% at 50% 20%,#fff 0%,var(--paper) 70%)}
.gallery-main img{width:100%;height:100%;object-fit:contain;background:#fff}
.gallery-main .ph svg{width:96px;height:96px}
.thumbs{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.thumbs button{width:76px;height:76px;border:2px solid var(--line);border-radius:12px;overflow:hidden;padding:0;cursor:pointer;background:var(--paper)}
.thumbs button.on{border-color:var(--forest)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.pd-info{align-self:start;position:sticky;top:170px}
.pd-info h1{font-size:clamp(30px,3.6vw,46px);margin-top:8px}
.codes{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.code{font-family:var(--f-mono);font-size:12px;padding:6px 10px;border-radius:8px;background:var(--paper);border:1px solid var(--line)}
.code b{font-family:var(--f-body);font-weight:600;color:var(--muted);margin-right:6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.pd-price{margin-top:24px;padding:22px;border-radius:16px;border:1px solid var(--line);display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.pd-price .pprice .now{font-size:40px}
.pd-cta{display:grid;gap:10px;margin-top:16px}
.pd-cta .btn{min-height:56px;font-size:16px}
.ask-for{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:flex-start;margin-top:4px}
.ask-for svg{width:16px;height:16px;flex:none;margin-top:2px;color:var(--green-d)}
.pd-sections{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:20px;padding-bottom:56px}
.box{border:1px solid var(--line);border-radius:16px;padding:24px;min-width:0;background:var(--bg)}
.box h3{font-size:22px;margin-bottom:14px}
table.kv{width:100%;border-collapse:collapse;font-size:14px}
table.kv th,table.kv td{text-align:left;padding:11px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.kv tr:last-child th,table.kv tr:last-child td{border-bottom:0}
table.kv th{color:var(--muted);font-weight:500;width:45%;padding-right:12px}
.compat{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.compat li{display:flex;gap:12px;align-items:center;font-size:14.5px;font-weight:500}
.compat li svg{width:20px;height:20px;color:var(--green-d);flex:none}
.note{font-size:12.5px;color:var(--muted);margin-top:14px}
.pd-sticky{display:none}
@media (max-width:900px){
  .pd{grid-template-columns:1fr;gap:24px;padding-block:20px 32px}
  .pd-info{position:static}
  .gallery-main{aspect-ratio:4/3}
  .util .l a{display:none}
  .pd-sticky{display:flex;gap:10px;position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:55;padding:10px var(--gut-r) 10px var(--gut-l);background:rgba(255,255,255,.97);border-top:1px solid var(--line)}
  .pd-sticky .btn{flex:1;min-height:48px}
  .pd-sticky .btn:first-child{flex:0 0 auto}
  .site.has-sticky{padding-bottom:calc(136px + env(safe-area-inset-bottom,0px))}
}

/* orçamento */
.qlist{display:flex;flex-direction:column;gap:12px}
.qitem{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:16px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:12px;background:var(--bg)}
.qthumb{width:72px;height:72px;border-radius:12px;background:var(--paper);display:grid;place-items:center;overflow:hidden;flex:none}
.qthumb img{width:100%;height:100%;object-fit:cover}
.qthumb svg{width:30px;height:30px;color:#a3ada6}
.qty{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px}
.qty button{width:32px;height:32px;border:0;border-radius:50%;background:var(--paper);cursor:pointer;font-weight:700}
@media (max-width:480px){.qitem{grid-template-columns:56px minmax(0,1fr)}.qitem .qty{grid-column:2;justify-self:start}.qthumb{width:56px;height:56px}}

/* rodapé */
.foot{background:var(--night);color:#b9b9d8}
.foot .stripe{height:8px;background:linear-gradient(90deg,var(--blue) 0 58%,var(--green) 58% 92%,var(--wheat) 92%)}
.foot .cols{display:grid;grid-template-columns:1.5fr 1fr 1fr 1.2fr;gap:36px;padding-block:56px 36px}
.foot h4{color:#fff;font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:16px}
.foot a{text-decoration:none;color:#b9b9d8}
.foot a:hover{color:#fff}
.foot ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;font-size:14px}
.foot .logo-box{background:#fff;border-radius:12px;padding:12px 14px;display:inline-block;line-height:0}
.foot .logo-box img{height:44px;width:auto}
.foot .bottom{border-top:1px solid rgba(255,255,255,.1);padding-block:18px;font-size:12.5px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media (max-width:860px){.foot .cols{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.foot .cols{grid-template-columns:1fr}}
.wa-float{position:fixed;right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:45;height:58px;border-radius:999px;background:var(--green);color:#fff;display:flex;align-items:center;gap:10px;padding:0 22px 0 16px;box-shadow:0 10px 28px rgba(1,144,64,.4);border:0;cursor:pointer;font-weight:600}
.wa-float svg{width:28px;height:28px}

/* modal / toast */
.modal-back{position:fixed;inset:0;background:rgba(6,20,13,.55);z-index:100;display:grid;place-items:center;padding:16px;backdrop-filter:blur(3px)}
.modal{background:var(--bg);border-radius:20px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.modal h3{font-size:26px;margin-bottom:8px}
.modal pre{white-space:pre-wrap;font-family:var(--f-body);font-size:14px;background:#e9f6ee;border-radius:14px 14px 14px 4px;padding:16px;margin:16px 0;color:#14301f}
.modal .row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.lightbox img{width:100%;height:auto;border-radius:12px;background:#fff}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--forest);color:#fff;padding:13px 20px;border-radius:999px;z-index:120;font-weight:500;box-shadow:var(--sh-2);max-width:calc(100% - 32px);text-align:center}
.toast.err{background:var(--danger)}
@media (max-width:900px){.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}

/* ===== PAINEL ===== */
.adm{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh;background:var(--paper)}
.side{background:var(--night);color:#c4c4e2;padding:20px 14px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow:auto}
.side .logo-mini{background:#fff;border-radius:12px;padding:10px 12px;line-height:0;margin-bottom:18px}
.side .logo-mini img{height:34px;width:auto}
.side .grp{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#7e7eaa;padding:14px 12px 6px;font-weight:600}
.side a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;text-decoration:none;font-weight:500;color:#c4c4e2;font-size:14.5px}
.side a svg{width:18px;height:18px;flex:none}
.side a:hover{background:rgba(255,255,255,.06);color:#fff}
.side a.on{background:var(--green);color:#fff;font-weight:600}
.side .who{margin-top:auto;padding:14px;border-radius:12px;background:rgba(255,255,255,.06);font-size:13px;color:#fff}
.side .who span{color:#9d9dc4}
.side .who button{color:#ffb4ab;background:none;border:0;padding:6px 0 0;cursor:pointer;font-weight:600;font-size:12.5px}
.adm-main{padding-block:30px 72px;padding-left:max(16px,2.4vw);padding-right:max(16px,env(safe-area-inset-right,0px),2.4vw);min-width:0}
.adm-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.adm-head h1{font-size:34px}
.adm-head p{color:var(--muted);font-size:14px;margin-top:6px}
.adm-head .crumbs{color:var(--muted);margin-bottom:6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:22px}
.kpi{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:18px 18px 18px 22px;display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden}
.kpi span{font-size:13px;color:var(--muted);font-weight:500}
.kpi b{font-family:var(--f-display);font-size:38px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line)}
.kpi.g::after{background:var(--green)}.kpi.b::after{background:var(--blue)}.kpi.w::after{background:var(--wheat)}.kpi.r::after{background:var(--danger)}
.panel{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:22px;min-width:0}
.panel h2{font-size:21px;margin-bottom:14px}
.panel+.panel{margin-top:16px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.tbl-wrap{overflow-x:auto;background:var(--bg);border:1px solid var(--line);border-radius:16px}
table.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:780px}
table.tbl th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding:14px;border-bottom:1px solid var(--line);background:var(--paper)}
table.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:0}
table.tbl tbody tr:hover td{background:#fafbf8}
table.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.t-prod{display:flex;gap:12px;align-items:center;min-width:230px}
.t-thumb{width:46px;height:46px;border-radius:10px;background:var(--paper);flex:none;display:grid;place-items:center;overflow:hidden}
.t-thumb img{width:100%;height:100%;object-fit:cover}

let S;
function load(){
  try{const raw=localStorage.getItem(LS_KEY);if(raw){const d=JSON.parse(raw);
    if(d&&d.v===1){d.banners=seedBanners();d.v=2}
    if(d&&d.v===2){const sb=seedBanners();d.banners.forEach(b=>{const x=sb.find(y=>y.id===b.id);if(x&&!b.imagem)b.imagem=x.imagem});
      sb.filter(x=>!d.banners.some(b=>b.id===x.id)).forEach(x=>d.banners.push(Object.assign({},x,{ordem:d.banners.length+1})));
      d.categories.forEach(c=>{if(c.imagem===undefined)c.imagem=CAT_IMG[c.slug]||''});d.v=3}
    if(d&&d.v===3){S=d;return}}}catch(e){}
  S=seed();
}

function searchText(p){return norm([p.nome,p.sku,p.codigo,p.alternativos,(brand(p.marcaId)||{}).nome,(cat(p.categoriaId)||{}).nome,p.aplicacoes.join(' '),p.tags,p.curta].join(' '))}
function matches(p,q){if(!q)return true;const t=searchText(p);return norm(q).split(/\s+/).every(w=>t.includes(w))}

const bannerTitle=b=>esc(plainTitle(b.titulo)).replace(/\*([^*]+)\*/g,'<em>$1</em>');

function waNumberFor(p){const v=p&&seller(p.vendedorId);if(v&&v.ativo&&v.whatsapp)return{num:v.whatsapp,quem:v.nome};return{num:S.settings.whatsapp,quem:'WhatsApp geral da loja'}}
function waMessage(p){
  const L=['Olá! Vi uma peça no site da DAMATA Peças e Ferramentas e gostaria de consultar a disponibilidade.','','Produto: '+p.nome];
  const b=brand(p.marcaId);if(b)L.push('Marca: '+b.nome);
  const cod=[p.sku,p.codigo].filter(Boolean).join(' / ');if(cod)L.push('Código/SKU: '+cod);
  if(p.aplicacoes.length)L.push('Modelo/Aplicação: '+p.aplicacoes.join(', '));
  if(showPrice(p))L.push('Preço anunciado: '+brl(onSale(p)?p.precoOferta:p.preco));
  L.push('Link: '+productUrl(p),'','Podem me ajudar?');
  return L.join('\n');
}
function quoteMessage(){
  const L=['Olá! Montei uma lista de orçamento no site da DAMATA Peças e Ferramentas:',''];
  S.quote.forEach((q,i)=>{const p=prod(q.id);if(!p)return;L.push((i+1)+') '+p.nome+' — Cód. '+p.sku+' — Qtd: '+q.qtd);L.push('   '+productUrl(p))});
  L.push('','Podem verificar disponibilidade e valores?');return L.join('\n');
}

function priceHtml(p){

}

/* carrossel */
let slideI=0,slideTimer=null;
function showSlide(i){const sl=$$('#hero .slide');if(!sl.length)return;slideI=(i+sl.length)%sl.length;sl.forEach((s,k)=>s.classList.toggle('on',k===slideI));
  $$('#hero .dots button').forEach((d,k)=>{d.classList.remove('on');if(k===slideI){void d.offsetWidth;d.classList.add('on')}})}
function startCarousel(){clearInterval(slideTimer);slideI=0;const h=$('#hero');if(!h||$$('.slide',h).length<2)return;
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  slideTimer=setInterval(()=>{const hh=$('#hero');if(!hh){clearInterval(slideTimer);return}if(!hh.classList.contains('paused')&&!document.hidden)showSlide(slideI+1)},6500);
  h.addEventListener('mouseenter',()=>h.classList.add('paused'));h.addEventListener('mouseleave',()=>h.classList.remove('paused'));
  h.addEventListener('focusin',()=>h.classList.add('paused'));h.addEventListener('focusout',()=>h.classList.remove('paused'));}

/* estado do catálogo */
const CS={q:'',categoria:'',marca:'',aplicacao:'',disp:'',oferta:false,ordem:'relevancia',pagina:1};
const PER=9;
function filtered(){
  let L=published().filter(p=>matches(p,CS.q));
  if(CS.categoria)L=L.filter(p=>p.categoriaId===CS.categoria);
  if(CS.marca)L=L.filter(p=>p.marcaId===CS.marca);
  if(CS.aplicacao)L=L.filter(p=>p.aplicacoes.includes(CS.aplicacao));
  if(CS.disp)L=L.filter(p=>dispOf(p)[1]===CS.disp);
  if(CS.oferta)L=L.filter(p=>onSale(p)&&showPrice(p));
  const pr=p=>showPrice(p)?Number(onSale(p)?p.precoOferta:p.preco):Infinity;
  if(CS.ordem==='nome')L.sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
  if(CS.ordem==='menor')L.sort((a,b)=>pr(a)-pr(b));
  if(CS.ordem==='maior')L.sort((a,b)=>(pr(b)===Infinity?-1:pr(b))-(pr(a)===Infinity?-1:pr(a)));
  if(CS.ordem==='novos')L.sort((a,b)=>(b.novidade-a.novidade)||b.criado.localeCompare(a.criado));
  return L;
}

function compress(file,max){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,(max||900)/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.78))};im.onerror=()=>rej(new Error('img'));im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
function readProductForm(form){
  const f=new FormData(form),d=draft;
  ['nome','sku','codigo','alternativos','categoriaId','marcaId','curta','descricao','tags','status','disponibilidade','vendedorId'].forEach(k=>d[k]=String(f.get(k)||'').trim());
  d.preco=f.get('preco')===''?0:Number(f.get('preco'));d.precoOferta=f.get('precoOferta')===''?null:Number(f.get('precoOferta'));
  d.estoque=f.get('estoque')===''?null:Number(f.get('estoque'));
  d.mostrarPreco=!!f.get('mostrarPreco');d.destaque=!!f.get('destaque');d.novidade=!!f.get('novidade');
  d.aplicacoes=f.getAll('aplicacao');
  const ks=f.getAll('spec_k'),vs=f.getAll('spec_v');d.specs=ks.map((k,i)=>[String(k).trim(),String(vs[i]||'').trim()]).filter(s=>s[0]&&s[1]);
  return d;
}
function validateProduct(d){
  const errs={};
  if(!d.nome)errs.nome='Informe o nome do produto.';
  if(!d.sku)errs.sku='Informe o SKU.';else if(S.products.some(p=>p.id!==d.id&&norm(p.sku)===norm(d.sku)))errs.sku='Já existe um produto com este SKU.';
  if(!d.categoriaId)errs.cat='Escolha uma categoria.';
  if(d.preco<0)errs.preco='O preço não pode ser negativo.';
  if(d.precoOferta!=null&&d.precoOferta>0&&d.preco>0&&d.precoOferta>=d.preco)errs.oferta='A oferta precisa ser menor que o preço normal.';
  if(d.status==='publicado'&&d.mostrarPreco&&!d.preco&&S.settings.mostrarPrecos)errs.preco='Informe o preço ou desmarque “Mostrar preço no site”.';
  $$('.fld.err').forEach(x=>{x.classList.remove('err');const m=$('.msg',x);m&&(m.hidden=true)});
  Object.entries(errs).forEach(([k,m])=>{const w=$('#fw-'+k);if(w){w.classList.add('err');const s=$('.msg',w);s.textContent=m;s.hidden=false}});
  const first=Object.keys(errs)[0];if(first){const w=$('#fw-'+first);w&&w.scrollIntoView({behavior:'smooth',block:'center'})}
  return !first;
}

/* ---------- roteador ---------- */
function route(){
  const h=decodeURIComponent(location.hash.slice(1))||'inicio';
  closeModal();clearInterval(slideTimer);megaOpen=false;
  const app=$('#app');
  if(h.startsWith('admin')){
    if(!session){app.innerHTML=vLogin();window.scrollTo(0,0);return}
    let inner;
    if(h==='admin')inner=vDash();
    else if(h==='admin-produtos')inner=vAdmProducts();
    else if(h==='admin-novo')inner=vProductForm(null);
    else if(h.startsWith('admin-produto-')){const p=prod(h.slice(14));inner=p?vProductForm(p):'<div class="empty"><h3>Produto não encontrado</h3><a class="btn btn-green" href="#admin-produtos">Voltar</a></div>'}
    else if(['admin-categorias','admin-marcas','admin-aplicacoes'].includes(h))inner=vSimple(h);
    else if(h==='admin-banners')inner=vBanners();
    else if(h==='admin-vendedores')inner=vSellers();
    else if(h==='admin-empresa')inner=vCompany();
    else if(h==='admin-relatorios')inner=vReports();
    else if(h==='admin-usuarios')inner=vUsers();
    else inner='<div class="empty"><h3>Página não encontrada</h3></div>';
    app.innerHTML=adminShell(h,inner);
    if(h==='admin-produtos')renderAdmTable();
    if($('#photos'))renderPhotos();
  }else{
    let main,active=h;
    if(h==='inicio')main=vHome();
    else if(h==='produtos'||h==='ofertas'||h.startsWith('c-')){
      if(!CS._keep)Object.assign(CS,{q:'',categoria:'',marca:'',aplicacao:'',disp:'',oferta:false,ordem:'relevancia',pagina:1});CS._keep=false;
      if(h==='produtos')main=vCatalog(null);else if(h==='ofertas')main=vCatalog(null,true);else{const c=S.categories.find(x=>x.slug===h.slice(2)&&x.visivel);main=c?vCatalog(c):v404()}
    }
    else if(h.startsWith('p-')){const p=published().find(x=>x.slug===h.slice(2));main=p?vProduct(p):v404()}
    else if(h==='orcamento')main=vQuote();
    else if(h==='sobre')main=vAbout();
    else if(h==='contato')main=vContact();
    else if(h==='privacidade')main=vPrivacy();
    else main=v404();
    app.innerHTML=`<div class="site${h.startsWith('p-')?' has-sticky':''}">`+siteHeader(active)+'<main id="main">'+main+'</main>'+siteFooter()+bottomNav(active)+'</div>';
    if($('#results'))renderResults();
    if($('#hero'))startCarousel();
  }
  window.scrollTo(0,0);
}
function go(h){if(location.hash==='#'+h)route();else location.hash=h}
function refreshBadges(){
  const n=S.quote.reduce((a,q)=>a+q.qtd,0);
  $$('a[href="#orcamento"].icon-pill, .bnav a[href="#orcamento"]').forEach(a=>{let b=$('.badge',a);if(!n){b&&b.remove();return}if(!b){b=document.createElement('span');b.className='badge';a.insertBefore(b,a.firstChild.nextSibling)}b.textContent=n});
}
function closeMega(){megaOpen=false;const m=$('#mega');m&&m.remove();const mb=$('.mega-btn');mb&&mb.setAttribute('aria-expanded','false')}

/* ---------- eventos ---------- */
document.addEventListener('click',async e=>{

    case 'by-machine':Object.assign(CS,{q:'',categoria:'',marca:'',aplicacao:t.dataset.name,disp:'',oferta:false,pagina:1,_keep:true});go('produtos');break;
    case 'add-quote':{const q=S.quote.find(x=>x.id===id);q?q.qtd++:S.quote.push({id,qtd:1});save();toast('Adicionado à lista de orçamento');refreshBadges();break}
    case 'qty':{const q=S.quote.find(x=>x.id===id);if(q){q.qtd+=Number(t.dataset.d);if(q.qtd<1)S.quote=S.quote.filter(x=>x.id!==id)}save();route();break}
    case 'clear-quote':S.quote=[];save();route();break;
    case 'send-quote':waModal('Enviar lista de orçamento',quoteMessage(),{num:S.settings.whatsapp,quem:'WhatsApp geral da loja'});S.quote.forEach(q=>S.events.push({id:uid(),tipo:'whatsapp',produtoId:q.id,vendedorId:'',origem:'lista-orcamento',data:now()}));save();break;
    case 'see-all':e.preventDefault();CS.q=SQ.trim();Object.assign(CS,{categoria:'',marca:'',aplicacao:'',disp:'',oferta:false,pagina:1,_keep:true});go('produtos');break;
    case 'page':CS.pagina=Number(t.dataset.p);renderResults();$('#results').scrollIntoView({behavior:'smooth'});break;
    case 'rm-filter':{const k=t.dataset.k;CS[k]=k==='oferta'?false:'';CS.pagina=1;const map={q:'f-q',categoria:'f-cat',marca:'f-marca',aplicacao:'f-app',disp:'f-disp'};if(map[k]&&$('#'+map[k]))$('#'+map[k]).value='';if(k==='oferta'&&$('#f-oferta'))$('#f-oferta').checked=false;renderResults();break}
    case 'clear-filters':Object.assign(CS,{q:'',categoria:'',marca:'',aplicacao:'',disp:'',oferta:false,pagina:1});go('produtos');break;
    case 'toggle-filters':$('#filters').classList.toggle('open');break;
    case 'thumb':{const p=published().find(x=>x.slug===location.hash.slice(3));gIdx=Number(t.dataset.i);$('#gmain').innerHTML=`<img src="${p.imagens[gIdx]}" alt="${esc(p.nome)}">`;$$('.thumbs button').forEach((b,i)=>b.classList.toggle('on',i===gIdx));break}
    case 'zoom':{const p=published().find(x=>x.slug===location.hash.slice(3));if(p&&p.imagens.length)modal(`<div class="lightbox"><img src="${p.imagens[gIdx]}" alt="${esc(p.nome)}"></div><div class="row"><button class="btn btn-outline" data-act="close">Fechar</button></div>`);break}
    case 'logout':setSession(null);go('inicio');break;
    case 'reset-demo':confirmBox('Isso apaga tudo o que você alterou neste navegador e volta para os dados de demonstração.','Restaurar',()=>{S=seed();save();toast('Demonstração restaurada');route()});break;
    case 'confirm-ok':{const cb=confirmCb;confirmCb=null;closeModal();cb&&cb();break}
    case 'toggle-pub':{const p=prod(id);p.status=p.status==='publicado'?'rascunho':'publicado';p.atualizado=now();audit((p.status==='publicado'?'Publicou ':'Despublicou ')+p.nome);save();renderAdmTable();toast(p.status==='publicado'?'Publicado no site':'Removido do site');break}
    case 'toggle-dest':{const p=prod(id);p.destaque=!p.destaque;save();renderAdmTable();break}
    case 'dup':{const p=prod(id),c=JSON.parse(JSON.stringify(p));c.id=uid();c.nome=p.nome+' (cópia)';c.sku=p.sku+'-COPIA';c.slug=uniqueSlug(slugify(c.nome),c.id);c.status='rascunho';c.criado=c.atualizado=now();S.products.push(c);audit('Copiou '+p.nome);save();go('admin-produto-'+c.id);break}
    case 'del-prod':{const p=prod(id);confirmBox(`Excluir <b>${esc(p.nome)}</b>? As fotos também serão apagadas. Se preferir manter o histórico, use o status “Arquivado”.`,'Excluir produto',()=>{S.products=S.products.filter(x=>x.id!==id);S.quote=S.quote.filter(x=>x.id!==id);audit('Excluiu '+p.nome);save();renderAdmTable();toast('Produto excluído')});break}
    case 'add-compat':{const s=$('#compat-sel');const v=s.value;if(!v)return;const cur=$$('#compat-chips input').map(i=>i.value);if(!cur.includes(v))$('#compat-chips').insertAdjacentHTML('beforeend',chip(v));s.value='';break}
    case 'rm-chip':t.closest('.chip').remove();break;
    case 'add-spec':$('#specs').insertAdjacentHTML('beforeend',specRow(['','']));$$('#specs .spec-row').pop().querySelector('input').focus();break;
    case 'rm-spec':t.closest('.spec-row').remove();break;
    case 'ph-del':draft.imagens.splice(Number(t.dataset.i),1);renderPhotos();break;
    case 'ph-main':{const i=Number(t.dataset.i);const [x]=draft.imagens.splice(i,1);draft.imagens.unshift(x);renderPhotos();break}
    case 'ph-left':case 'ph-right':{const i=Number(t.dataset.i),j=a==='ph-left'?i-1:i+1;if(j<0||j>=draft.imagens.length)return;[draft.imagens[i],draft.imagens[j]]=[draft.imagens[j],draft.imagens[i]];renderPhotos();break}
    case 'preview-wa':{const d=readProductForm($('form[data-form=product]'));if(!d.slug)d.slug=slugify(d.nome)||'produto';waModal('Prévia da mensagem',waMessage(d),waNumberFor(d));break}
    case 'cat-up':case 'cat-down':{const L=S.categories.slice().sort((x,y)=>x.ordem-y.ordem);const i=L.findIndex(c=>c.id===id),j=a==='cat-up'?i-1:i+1;if(j<0||j>=L.length)return;[L[i],L[j]]=[L[j],L[i]];L.forEach((c,k)=>c.ordem=k+1);save();route();break}
    case 'cat-vis':{const c=cat(id);c.visivel=!c.visivel;audit((c.visivel?'Exibiu':'Ocultou')+' categoria '+c.nome);save();route();break}
    case 'del-simple':{const n=Number(t.dataset.n),kind=t.dataset.kind;if(n>0){modal(`<h3>Não é possível excluir</h3><p>Existem <b>${n}</b> produto(s) usando este item. Troque esses produtos para outro item antes de excluir${kind==='admin-categorias'?', ou oculte a categoria do site':''}.</p><div class="row"><button class="btn btn-green" data-act="close">Entendi</button></div>`);return}
      const key={'admin-categorias':'categories','admin-marcas':'brands','admin-aplicacoes':'models'}[kind];const it=S[key].find(x=>x.id===id);confirmBox(`Excluir <b>${esc(it.nome)}</b>?`,'Excluir',()=>{S[key]=S[key].filter(x=>x.id!==id);audit('Excluiu '+it.nome);save();route()});break}
    case 'seller-toggle':{const v=seller(id);v.ativo=!v.ativo;save();route();toast(v.ativo?'Vendedor ativado':'Vendedor desativado. Consultas vão para o WhatsApp geral.');break}
    case 'seller-test':{const v=seller(id);waModal('Testar link do vendedor','Teste de link do site DAMATA.',{num:v.whatsapp,quem:v.nome});break}
    case 'seller-del':{const v=seller(id),n=S.products.filter(p=>p.vendedorId===id).length;confirmBox(`Excluir <b>${esc(v.nome)}</b>?${n?` ${n} produto(s) passarão a usar o WhatsApp geral.`:''}`,'Excluir',()=>{S.sellers=S.sellers.filter(x=>x.id!==id);S.products.forEach(p=>{if(p.vendedorId===id)p.vendedorId=''});audit('Excluiu vendedor '+v.nome);save();route()});break}
    case 'bn-add':{const b={id:uid(),eyebrow:'DAMATA',titulo:'Novo banner com *destaque*',subtitulo:'',cta:'Ver produtos',link:'produtos',arte:'lavoura',imagem:'',ativo:false,ordem:S.banners.length+1};S.banners.push(b);audit('Criou banner');save();route();toast('Banner criado como inativo. Edite e ative.');break}
    case 'bn-toggle':{const b=S.banners.find(x=>x.id===id);b.ativo=!b.ativo;audit((b.ativo?'Ativou':'Desativou')+' banner');save();route();toast(b.ativo?'Banner ativo no site':'Banner desativado');break}
    case 'bn-up':case 'bn-down':{const L=S.banners.slice().sort((x,y)=>x.ordem-y.ordem);const i=L.findIndex(b=>b.id===id),j=a==='bn-up'?i-1:i+1;if(j<0||j>=L.length)return;[L[i],L[j]]=[L[j],L[i]];L.forEach((b,k)=>b.ordem=k+1);save();route();break}
    case 'bn-rmimg':{const b=S.banners.find(x=>x.id===id);b.imagem='';save();route();break}

let lastSubmitStatus=null;
document.addEventListener('click',e=>{const b=e.target.closest('button[type=submit][data-status]');if(b)lastSubmitStatus=b.dataset.status});
document.addEventListener('submit',e=>{
  const f=e.target,k=f.dataset.form;if(!k)return;e.preventDefault();
  if(k==='search'||k==='finder'){const fd=new FormData(f);CS.q=String(fd.get('q')||'').trim();CS.categoria=k==='finder'?String(fd.get('categoria')||''):'';Object.assign(CS,{marca:'',aplicacao:k==='finder'?String(fd.get('aplicacao')||''):'',disp:'',oferta:false,pagina:1,_keep:true});go('produtos');return}
  if(k==='login'){const fd=new FormData(f);const u=S.users.find(x=>x.email===String(fd.get('email')).trim().toLowerCase());if(u&&fd.get('senha')==='demo123'){setSession({nome:u.nome,papel:u.papel});audit('Entrou no painel');save();route()}else{$('#l-err').hidden=false}return}
  if(k==='product'){
    const d=readProductForm(f);if(lastSubmitStatus){d.status=lastSubmitStatus==='rascunho'&&d.status==='arquivado'?'arquivado':lastSubmitStatus;$('#p-status').value=d.status}
    if(!validateProduct(d)){toast('Confira os campos destacados',true);return}
    const old=prod(d.id);d.slug=uniqueSlug(slugify(d.nome),d.id);d.atualizado=now();
    if(old)Object.assign(old,d);else{d.criado=now();S.products.push(d)}
    audit((old?'Editou ':'Cadastrou ')+d.nome);
    if(save()){lastSaved={id:d.id,status:d.status,slug:d.slug};go('admin-produto-'+d.id)}
    return;
  }
  if(k==='banner'){const b=S.banners.find(x=>x.id===f.dataset.id),fd=new FormData(f);['titulo','eyebrow','cta','subtitulo','link','arte'].forEach(x=>b[x]=String(fd.get(x)||'').trim());
    if(!b.titulo){toast('Informe o título do banner',true);return}audit('Editou banner');save();route();toast('Banner salvo. A página inicial já mostra a mudança.');return}
  if(k==='simple'){const kind=f.dataset.kind,fd=new FormData(f),nome=String(fd.get('nome')).trim();if(!nome)return;
    const key={'admin-categorias':'categories','admin-marcas':'brands','admin-aplicacoes':'models'}[kind];
    if(S[key].some(x=>norm(x.nome)===norm(nome))){toast('Já existe um item com esse nome',true);return}
    const it={id:uid(),nome};if(kind==='admin-categorias')Object.assign(it,{slug:slugify(nome),icone:fd.get('icone'),descricao:'',ordem:S.categories.length+1,visivel:true});
    S[key].push(it);audit('Adicionou '+nome);save();route();toast('Adicionado');return}
  if(k==='seller'){const fd=new FormData(f),nome=String(fd.get('nome')).trim();if(!nome)return;const wa=String(fd.get('whatsapp')||'').replace(/\D/g,'');if(wa&&(wa.length<12||wa.length>13)){toast('Use o número completo: 55 + DDD + número',true);return}
    S.sellers.push({id:uid(),nome,whatsapp:wa,ativo:true,obs:String(fd.get('obs')||'').trim()});audit('Adicionou vendedor '+nome);save();route();toast('Vendedor adicionado');return}
  if(k==='company'){const fd=new FormData(f);const wa=String(fd.get('whatsapp')||'').replace(/\D/g,'');
    if(wa&&(wa.length<12||wa.length>13)){toast('WhatsApp geral: use 55 + DDD + número',true);return}
    ['telefone','email','instagram','endereco','cidade','uf','horario','sobre','dominio'].forEach(x=>S.settings[x]=String(fd.get(x)||'').trim());
    S.settings.whatsapp=wa;S.settings.mostrarPrecos=!!fd.get('mostrarPrecos');
    audit('Atualizou dados da empresa');save();toast('Alterações salvas e publicadas no site');return}
});
let deb;
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q-top'){suggest(t.value);return}
  if(t.id==='f-q'){clearTimeout(deb);deb=setTimeout(()=>{CS.q=t.value;CS.pagina=1;renderResults()},180);return}
  if(t.id==='a-q'){clearTimeout(deb);deb=setTimeout(()=>{AF.q=t.value;renderAdmTable()},180);return}
});
document.addEventListener('change',async e=>{
  const t=e.target;
  const map={'f-cat':'categoria','f-marca':'marca','f-app':'aplicacao','f-disp':'disp','f-ordem':'ordem'};
  if(map[t.id]){CS[map[t.id]]=t.value;CS.pagina=1;renderResults();return}
  if(t.id==='f-oferta'){CS.oferta=t.checked;CS.pagina=1;renderResults();return}
  if(t.id==='a-status'){AF.status=t.value;renderAdmTable();return}
  if(t.id==='a-cat'){AF.cat=t.value;renderAdmTable();return}
  if(t.id==='dash-days'){dashDays=Number(t.value);route();return}
  if(t.id==='rep-days'){repDays=Number(t.value);route();return}
  if(t.dataset.quick){const p=prod(t.dataset.id),k=t.dataset.quick;let v=t.value;
    if(k!=='disponibilidade'){v=v===''?(k==='preco'?0:null):Number(v);if(v!=null&&v<0){toast('Valor inválido',true);return}if(k==='precoOferta'&&v&&v>=p.preco){toast('A oferta precisa ser menor que o preço normal',true);t.value=p.precoOferta||'';return}}
    p[k]=v;p.atualizado=now();audit('Alterou '+({preco:'preço',precoOferta:'oferta',disponibilidade:'disponibilidade'}[k])+' de '+p.nome);save();toast('Salvo. O site já mostra o novo valor.');return}
  if(t.dataset.rename){const key={'admin-categorias':'categories','admin-marcas':'brands','admin-aplicacoes':'models'}[t.dataset.rename];const it=S[key].find(x=>x.id===t.dataset.id);const nv=t.value.trim();if(!nv){t.value=it.nome;return}
    if(key==='models')S.products.forEach(p=>{p.aplicacoes=p.aplicacoes.map(a=>a===it.nome?nv:a)});it.nome=nv;if(key==='categories')it.slug=slugify(nv);audit('Renomeou para '+nv);save();toast('Nome atualizado');return}
  if(t.dataset.sellerWa){const v=seller(t.dataset.sellerWa),wa=t.value.replace(/\D/g,'');if(wa&&(wa.length<12||wa.length>13)){toast('Use o número completo: 55 + DDD + número',true);return}v.whatsapp=wa;t.value=wa;save();toast('WhatsApp do vendedor salvo');return}
  if(t.dataset.catImg){const f=t.files&&t.files[0];if(!f)return;if(!/^image\/(jpeg|png|webp)$/.test(f.type)||f.size>8*1024*1024){toast('Envie JPG, PNG ou WebP até 8 MB',true);return}
    try{const c=cat(t.dataset.catImg);c.imagem=await compress(f,800);audit('Trocou imagem da categoria '+c.nome);if(save()){route();toast('Imagem da categoria atualizada')}}catch(err){toast('Não foi possível ler a imagem',true)}return}
  if(t.dataset.bnImg){const f=t.files&&t.files[0];if(!f)return;if(!/^image\/(jpeg|png|webp)$/.test(f.type)||f.size>8*1024*1024){toast('Envie JPG, PNG ou WebP até 8 MB',true);return}
    try{const b=S.banners.find(x=>x.id===t.dataset.bnImg);b.imagem=await compress(f,1600);audit('Trocou foto de banner');if(save()){route();toast('Foto do banner atualizada')}}catch(err){toast('Não foi possível ler a imagem',true)}return}
  if(t.id==='ph-input'){
    const files=Array.from(t.files||[]);let bad=0;
    for(const f of files){if(!/^image\/(jpeg|png|webp)$/.test(f.type)||f.size>8*1024*1024){bad++;continue}try{draft.imagens.push(await compress(f))}catch(err){bad++}}
    renderPhotos();if(bad)toast(bad+' arquivo(s) ignorado(s): envie JPG, PNG ou WebP até 8 MB',true);
  }
});
/* sugestões de busca */
let SQ='';
function suggest(q){
  const box=$('#suggest');if(!box)return;
  if(norm(q).length<2){box.hidden=true;return}
  const L=published().filter(p=>matches(p,q)).slice(0,6);SQ=q;
  box.innerHTML=L.length?L.map(p=>`<a href="#p-${esc(p.slug)}"><span class="qthumb" style="width:42px;height:42px;border-radius:10px">${p.imagens[0]?`<img src="${p.imagens[0]}" alt="">`:catIcon((cat(p.categoriaId)||{}).icone)}</span><span style="min-width:0"><span class="s-name">${esc(p.nome)}</span><br><span class="s-meta mono">${esc(p.sku)}${p.codigo?' · '+esc(p.codigo):''}</span></span></a>`).join('')+`<a href="#produtos" data-act="see-all" style="justify-content:center;font-weight:600;color:var(--green-d)">Ver todos os resultados</a>`:`<a href="#produtos" data-act="see-all" style="color:var(--muted)">Nenhuma sugestão. Pressione Enter para buscar.</a>`;
  box.hidden=false;
}
document.addEventListener('click',e=>{const b=$('#suggest');if(b&&!e.target.closest('.search'))b.hidden=true});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();const b=$('#suggest');b&&(b.hidden=true);if(megaOpen)closeMega()}if(e.key==='Enter'&&e.target.id==='gmain')e.target.click()});
window.addEventListener('hashchange',route);

load();
route();
})();
